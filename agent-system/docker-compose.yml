services:
  # Outbound validation proxy for all browser traffic.
  # Pinned destination IP dialing, DNS rebinding prevention, and default-deny.
  browser-proxy:
    build:
      context: ./backend
      dockerfile: docker/qa-sandbox.Dockerfile
    command: ["python", "-m", "agent_system.services.browser_proxy", "--host", "0.0.0.0", "--port", "8080"]
    networks:
      - browser-isolated
      - public-egress
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"

  # Dedicated, egress-isolated Chromium container.
  # Placed on an internal-only network with NO default gateway and NO direct internet access.
  # All outbound traffic MUST transit browser-proxy.
  browser:
    image: mcr.microsoft.com/playwright:v1.48.0-noble
    command: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      HTTP_PROXY: "http://browser-proxy:8080"
      HTTPS_PROXY: "http://browser-proxy:8080"
      ALL_PROXY: "http://browser-proxy:8080"
      NO_PROXY: ""
    networks:
      - browser-isolated
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "pwuser"
    restart: unless-stopped

  # Backend orchestrator.
  backend:
    build:
      context: ./backend
      dockerfile: docker/qa-sandbox.Dockerfile
    command: ["python", "-m", "uvicorn", "agent_system.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BROWSER_PROXY_URL: "http://browser-proxy:8080"
      TOOLS_SHELL_MODE: "sandbox"
    networks:
      - browser-isolated
      - public-egress
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Optional: OpenConnector connector gateway (1,000+ SaaS providers via
  # Actions + MCP). Set OPENCONNECTOR_BASE_URL=http://localhost:3000 in
  # .env.local to expose it to the agent. Generate secrets first:
  #   OOMOL_CONNECT_ENCRYPTION_KEY=$(openssl rand -base64 32)
  #   OOMOL_CONNECT_ADMIN_TOKEN=$(openssl rand -base64 32)
  openconnector:
    # Pinned by digest (update intentionally, not via :latest):
    # ghcr.io/oomol-lab/open-connector:latest @ sha256:PIN_ME
    image: ghcr.io/oomol-lab/open-connector:latest
    ports:
      - "3000:3000"
    environment:
      OOMOL_CONNECT_ORIGIN: "http://localhost:3000"
      OOMOL_CONNECT_ENCRYPTION_KEY: "${OOMOL_CONNECT_ENCRYPTION_KEY:-}"
      OOMOL_CONNECT_ADMIN_TOKEN: "${OOMOL_CONNECT_ADMIN_TOKEN:-}"
    volumes:
      - openconnector_data:/app/data
    networks:
      - public-egress

volumes:
  openconnector_data:

networks:
  # internal: true disables default gateway, blocking direct outbound connections,
  # direct external DNS queries, and UDP/QUIC egress bypasses.
  browser-isolated:
    driver: bridge
    internal: true
  public-egress:
    driver: bridge
