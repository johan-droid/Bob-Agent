name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Offline-first suite by design: no secrets required for any gate.
env:
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  backend:
    name: backend (ruff + mypy --strict + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps
        working-directory: backend
        run: uv sync --group dev

      - name: make check
        run: make check

  web:
    name: web smoke (headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: uv sync --group dev

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install headless Chromium (Playwright)
        working-directory: web
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium || npx playwright-core install chromium

      - name: Web smoke test
        working-directory: web
        run: node smoke-test.mjs
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
