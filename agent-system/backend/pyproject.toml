[project]
name = "agent-system"
version = "0.1.0"
description = "Local autonomous multi-agent AI system — backend orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-ulid>=2.6",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "apscheduler>=3.11.3",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.15.0",
    "docker>=7.2.0",
    "pyyaml>=6.0.3",
    "fpdf2>=2.8.8",
    "python-docx>=1.1",
    "python-pptx>=1.0.2",
    "httpx>=0.28.1",
    "cryptography>=50.0.1",
    "paramiko>=3.4",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
memory = ["sentence-transformers>=2.7"]
telemetry = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.scripts]
agentctl = "agent_system.cli.main:entrypoint"
# MCP server shipped with Bob: keeps the Obsidian vault updated and maintains
# the dedicated Bob Agent record. Attach via MCP_SERVERS (see docs/CONFIGURATION.md).
bob-vault-mcp = "agent_system.mcp_servers.vault:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "coverage>=7.16.0",
    "types-docker>=7.2.0.20260827",
    "types-pyyaml>=6.0.12.20260906",
    "profilis==1.0.0",
    "types-paramiko>=5.0.0.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:agent_system.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions", "alembic/env.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

# These modules belong to the optional `memory` / `telemetry` extras and are
# imported behind a runtime ImportError guard in src/. mypy still analyzes the
# guarded import sites, so without the extras a clean CI checkout reports
# import-not-found. Suppress only the synthesis failure for these modules (the
# runtime never relies on them unconditionally); if an extra is installed the
# types are still fully checked. Runtime imports depend on a try/except
# ImportError that raises with install instructions when the extra is absent.
[[tool.mypy.overrides]]
module = [
    "opentelemetry",
    "opentelemetry.metrics",
    "opentelemetry.trace",
    "opentelemetry.exporter.otlp.proto.http.metric_exporter",
    "opentelemetry.exporter.otlp.proto.http.trace_exporter",
    "opentelemetry.sdk.metrics",
    "opentelemetry.sdk.metrics.export",
    "opentelemetry.sdk.resources",
    "opentelemetry.sdk.trace",
    "opentelemetry.sdk.trace.export",
    "opentelemetry.instrumentation.fastapi",
    "opentelemetry.instrumentation.sqlalchemy",
    "opentelemetry.instrumentation.httpx",
    "sentence_transformers",
    "pymongo",
    "pymongo.errors",
    "boto3",
    "botocore",
    "botocore.exceptions",
]
ignore_missing_imports = true
